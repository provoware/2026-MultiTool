name: Foundation quality gate

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run foundation failure matrix and knowledge integrity
        run: npm run test:foundation
      - name: Run complete current quality gate
        run: npm run check
