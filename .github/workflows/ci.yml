name: PROVOWARE Cloud-Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stufe:
        description: 'Hoechste auszufuehrende Pruefstufe'
        required: true
        default: 'TIEF'
        type: choice
        options: [SCHNELL, TIEF, FREIGABE]

permissions:
  contents: read

concurrency:
  group: provoware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  schnell:
    name: SCHNELL - Vertrag und Kernpruefung
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Exakten Kandidaten laden
        uses: actions/checkout@v7

      - name: Node.js bereitstellen
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Gesperrte Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Abhaengigkeiten auf bekannte Risiken pruefen
        run: npm audit --package-lock-only --audit-level=moderate

      - name: SCHNELL-Pruefung ausfuehren
        run: npm run ci:schnell

      - name: Tauri-Quellstand erkennen
        id: tauri
        shell: bash
        run: |
          if [[ -f src-tauri/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "🔵 Tauri-Quellstand vorhanden: native Rust-Pruefung ist verpflichtend."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "🔵 Noch kein Tauri-Quellstand: native Rust-Pruefung entfällt."
          fi

      - name: Linux-Abhaengigkeiten fuer Tauri pruefbar bereitstellen
        if: steps.tauri.outputs.present == 'true'
        run: bash scripts/ci/install-tauri-linux-deps.sh core

      - name: Rust-Werkzeugkette pruefen
        if: steps.tauri.outputs.present == 'true'
        run: |
          echo "🟡 Rust-Werkzeugkette wird geprüft."
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
          echo "🟢 Rust-Werkzeugkette ist bereit."

      - name: Cargo-Lockdatei pruefen
        if: steps.tauri.outputs.present == 'true'
        shell: bash
        run: |
          if [[ -f src-tauri/Cargo.lock ]]; then
            echo "🟢 Cargo.lock vorhanden: Abhängigkeitsstand ist reproduzierbar festgelegt."
            exit 0
          fi
          mkdir -p runtime/ci-evidence
          (cd src-tauri && cargo generate-lockfile)
          cp src-tauri/Cargo.lock runtime/ci-evidence/generated-Cargo.lock
          echo "🔴 Cargo.lock fehlt. Eine reproduzierbare Lockdatei wurde als Fehlernachweis erzeugt."
          echo "ℹ️ Sie muss in den Quellstand übernommen werden; der Lauf bleibt absichtlich rot."
          exit 1

      - name: Rust formatieren, kompilieren und linten
        if: steps.tauri.outputs.present == 'true'
        working-directory: src-tauri
        run: |
          echo "🟡 Rust-Qualitätsgate läuft: Format → Check → Clippy."
          cargo fmt --all -- --check
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          echo "🟢 Rust-Qualitätsgate vollständig bestanden."

      - name: Schnelle Kern-Unit-Tests ausfuehren
        if: steps.tauri.outputs.present == 'true'
        working-directory: src-tauri
        run: |
          echo "🟡 P0.4-Speicherlogik und P0.5b-Ansichtspersistenz werden gezielt geprüft."
          cargo test --locked --lib storage_overview::tests
          cargo test --locked --lib workspace_visibility_
          echo "🟢 Gezielte Kern-Unit-Tests vollständig bestanden."

      - name: Diagnose nur bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schnell-fehlernachweis
          path: runtime/ci-evidence
          if-no-files-found: ignore
          retention-days: 5

  tief:
    name: TIEF - Integration und Bedienung
    needs: schnell
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.stufe == 'TIEF' ||
      inputs.stufe == 'FREIGABE'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Exakten Kandidaten laden
        uses: actions/checkout@v7

      - name: Node.js bereitstellen
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Gesperrte Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Vollstaendige Web- und Vertragspruefung
        run: npm run ci:tief

      - name: Tauri-Quellstand erkennen
        id: tauri
        shell: bash
        run: |
          if [[ -f src-tauri/Cargo.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "🔵 Tauri-Quellstand vorhanden: native Integration wird geprüft."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "🔵 Noch kein Tauri-Quellstand: native Integration entfällt."
          fi

      - name: Linux-Abhaengigkeiten fuer Tauri-E2E bereitstellen
        if: steps.tauri.outputs.present == 'true'
        run: bash scripts/ci/install-tauri-linux-deps.sh e2e

      - name: Rust-Integrationstests ausfuehren
        if: steps.tauri.outputs.present == 'true'
        working-directory: src-tauri
        run: |
          echo "🟡 Rust-Integrationstests laufen."
          cargo test --locked --all-targets
          echo "🟢 Rust-Integrationstests bestanden."

      - name: Native Tauri-E2E-Pflicht pruefen
        if: steps.tauri.outputs.present == 'true'
        shell: bash
        run: |
          if [[ ! -f tests/tauri-e2e/native_tauri_e2e.mjs ]]; then
            echo "🔴 Tauri ist vorhanden, aber der native Ende-zu-Ende-Test fehlt."
            exit 1
          fi
          echo "🟡 Nativer Tauri-E2E-Test wird vorbereitet."
          cargo install tauri-driver --locked
          (cd src-tauri && cargo build --locked)
          xvfb-run -a node tests/tauri-e2e/native_tauri_e2e.mjs
          echo "🟢 Nativer Tauri-E2E-Test bestanden."

      - name: Fehlernachweise nur bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tief-fehlernachweis
          path: |
            runtime/ci-evidence
            runtime/browser-acceptance
          if-no-files-found: ignore
          retention-days: 7

  freigabe-vorpruefung:
    name: FREIGABE - Kandidat darf gebaut werden
    needs: tief
    if: github.event_name == 'workflow_dispatch' && inputs.stufe == 'FREIGABE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exakten Kandidaten laden
        uses: actions/checkout@v7

      - name: Node.js bereitstellen
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Gesperrte Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Freigabefaehigkeit pruefen
        run: node scripts/ci/release-preflight.mjs

      - name: Freigabe-Blockade dokumentieren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freigabe-blockiert
          path: runtime/ci-evidence
          if-no-files-found: ignore
          retention-days: 7
