name: Foundation quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete foundation quality gate
        run: npm run check

  dependency-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build hardened manifest and lock candidate
        run: |
          cp tools/dependency/package.hardened.json package.json
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json'); console.log('LOCK_PACKAGES='+(Object.keys(l.packages).length-1)); console.log('LOCK_VERSION='+l.lockfileVersion)"
      - name: Audit hardened lock candidate
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Upload hardened dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: hardened-dependency-candidate
          path: |
            tools/dependency/package.hardened.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
