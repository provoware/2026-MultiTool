name: Foundation quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Run complete foundation quality gate
        run: npm run check
      - name: Run native desktop browser acceptance
        run: npm run test:foundation:browser
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-desktop-browser-acceptance
          path: runtime/browser-acceptance
          if-no-files-found: warn
          retention-days: 7
